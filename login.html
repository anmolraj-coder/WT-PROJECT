<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login | Sukoon Bites</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Simple Top Header -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-2">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <i class="bi bi-heart-pulse-fill"></i> Sukoon Bites
            </a>
            <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="auth-card">
                <div class="auth-brand-icon">
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark mb-1">Welcome Back!</h4>
                    <p class="text-muted small">Log in to track your orders and enjoy favorite dishes</p>
                </div>

                <!-- Demo Credentials Quick Fill Banner -->
                <div class="alert alert-info py-2 px-3 small rounded-3 d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <i class="bi bi-info-circle me-1"></i> <strong>Student Demo:</strong><br>
                        student@example.com / password123
                    </div>
                    <button type="button" class="btn btn-sm btn-light border fw-semibold text-primary" onclick="fillDemoUser()">
                        Auto Fill
                    </button>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="loginEmail" class="form-control" required placeholder="Enter your email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label small fw-semibold">Password</label>
                            <a href="#" class="small text-danger text-decoration-none" onclick="alert('For demo purposes, use password: password123')">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="loginPassword" class="form-control" required placeholder="Enter password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
                        Log In to Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Don't have an account yet? 
                    <a href="register.html" class="text-danger fw-bold text-decoration-none">Create Account</a>
                </div>

                <hr class="my-4">

                <div class="text-center small">
                    <a href="admin/admin-login.html" class="text-muted text-decoration-none">
                        <i class="bi bi-shield-lock me-1"></i> Restaurant Staff / Admin Portal
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="js/main.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>
</body>
</html>
