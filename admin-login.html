<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Sukoon Bites</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="auth-card w-100 shadow-lg border-0" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="auth-brand-icon bg-danger-subtle text-danger mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Sukoon Bites Admin</h4>
            <p class="text-muted small">Kitchen Operations & Management Console</p>
        </div>

        <!-- College Demo Credentials Info -->
        <div class="alert alert-warning py-2 px-3 small rounded-3 d-flex justify-content-between align-items-center mb-3">
            <div>
                <strong><i class="bi bi-info-circle me-1"></i> Demo Credentials:</strong><br>
                admin@sukoonbites.com / admin123
            </div>
            <button type="button" class="btn btn-sm btn-dark text-warning border-0 fw-semibold" onclick="fillDemoAdmin()">
                Auto Fill
            </button>
        </div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Admin Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="adminEmail" class="form-control" required placeholder="admin@sukoonbites.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Admin Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" id="adminPassword" class="form-control" required placeholder="admin123">
                </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Access Admin Dashboard
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <a href="../index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Return to Customer Website
            </a>
        </div>

        <div class="mt-3 text-center">
            <small class="text-muted" style="font-size: 0.75rem;">
                * Note: Client-side demonstration authentication for B.Tech college project.
            </small>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="../js/main.js"></script>
    <!-- Admin JS -->
    <script src="../js/admin.js"></script>
</body>
</html>
