<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Sukoon Bites</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Simple Top Header -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-2">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <i class="bi bi-heart-pulse-fill"></i> Sukoon Bites
            </a>
            <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Back to Home
            </a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="auth-card" style="max-width: 480px;">
                <div class="auth-brand-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>

                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark mb-1">Create an Account</h4>
                    <p class="text-muted small">Sign up in seconds to start ordering soothing meals</p>
                </div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Full Name *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="registerName" class="form-control" required placeholder="e.g. Aryan Varma">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email Address *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="registerEmail" class="form-control" required placeholder="e.g. aryan@college.edu">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Mobile Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">+91</span>
                            <input type="tel" id="registerPhone" class="form-control" required placeholder="9876543210" maxlength="10">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Default Campus / Hostel Address</label>
                        <textarea id="registerAddress" class="form-control" rows="2" placeholder="e.g. Room 201, Kaveri Hostel, University Campus"></textarea>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Password *</label>
                            <input type="password" id="registerPassword" class="form-control" required placeholder="Min 6 chars">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm Password *</label>
                            <input type="password" id="registerConfirmPassword" class="form-control" required placeholder="Re-type password">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm mb-3">
                        Register Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? 
                    <a href="login.html" class="text-danger fw-bold text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="js/main.js"></script>
    <!-- Auth JS -->
    <script src="js/auth.js"></script>
</body>
</html>
